version: '3.8'

services:
  mysql:
    image: "mysql:8.0"
    container_name: soa-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:z
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - soa-network

  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: soa-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - JWT_SECRET=U09BX0pXVF9TZWNyZXRfU09BX0RvQW5fMjAyNl9Tb2FfVG9UbmdOb2doaXBfU2VjcmV0
      - AUTH_SERVICE_URL=http://auth-service:8084
      - USER_SERVICE_URL=http://user-service:8081
      - DETAI_SERVICE_URL=http://detai-service:8082
      - COUNCIL_SERVICE_URL=http://council-service:8083
      - GRADING_SERVICE_URL=http://grading-service:8085
      - ANALYTICS_SERVICE_URL=http://analytics-service:8086
      - NOTIFICATION_SERVICE_URL=http://notification-service:8087
      - STORAGE_SERVICE_URL=http://storage-service:8088
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - soa-network

  auth-service:
    build:
      context: ./backend/auth-service
    container_name: soa-auth-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8084
      - JWT_SECRET=U09BX0pXVF9TZWNyZXRfU09BX0RvQW5fMjAyNl9Tb2FfVG9UbmdOb2doaXBfU2VjcmV0
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-smtp.gmail.com}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - USER_SERVICE_URL=http://user-service:8081
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - soa-network

  user-service:
    build:
      context: ./backend/user-service
    container_name: soa-user-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - soa-network

  detai-service:
    build:
      context: ./backend/detai-service
    container_name: soa-detai-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/detai_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - USER_SERVICE_URL=http://user-service:8081
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - soa-network

  council-service:
    build:
      context: ./backend/council-service
    container_name: soa-council-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/council_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - USER_SERVICE_URL=http://user-service:8081
      - DETAI_SERVICE_URL=http://detai-service:8082
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - soa-network

  grading-service:
    build:
      context: ./backend/grading-service
    container_name: soa-grading-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8085
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/grading_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - DETAI_SERVICE_URL=http://detai-service:8082
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - soa-network

  analytics-service:
    build:
      context: ./backend/analytics-service
    container_name: soa-analytics-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8086
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/analytics_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - DETAI_SERVICE_URL=http://detai-service:8082
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - soa-network

  notification-service:
    build:
      context: ./backend/notification-service
    container_name: soa-notification-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8087
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - soa-network

  storage-service:
    build:
      context: ./backend/storage-service
    container_name: soa-storage-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8088
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/storage_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - UPLOAD_DIR=/app/uploads
    volumes:
      - storage-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - soa-network

volumes:
  mysql-data:
  storage-uploads:

networks:
  soa-network:
    name: soa-network
    driver: bridge

server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service-sv
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/sinhvien/**, /api/v1/giangvien/**, /api/v1/khoa/**, /api/v1/lop/**

        - id: detai-service
          uri: ${DETAI_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/detai/**

        - id: council-service
          uri: ${COUNCIL_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/hoi-dong/**

        - id: grading-service
          uri: ${GRADING_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/diem/**

        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/thong-ke/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/thong-bao/**

        - id: storage-service
          uri: ${STORAGE_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/tai-lieu/**

app:
  jwt:
    secret: ${JWT_SECRET:U09BX0pXVF9TZWNyZXRfU09BX0RvQW5fMjAyNl9Tb2FfVG9UbmdOb2doaXBfU2VjcmV0}
